services:
  # Container 1: Frontend (React + Vite + Tailwind via Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:-unknown}
        RELEASE_ENV: ${RELEASE_ENV:-local}
    container_name: movie_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app_network

  # Container 2: Backend (FastAPI + Scikit-Learn MLP Model)
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:-unknown}
        RELEASE_ENV: ${RELEASE_ENV:-local}
    container_name: movie_backend
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql://deeplearning:deeplearning_secret@database:5432/movierec_db
      - PORT=8001
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app_network

  # Container 3: Database (PostgreSQL 16 + schema from database/init.sql, built from database/Dockerfile)
  database:
    build:
      context: ./database
      dockerfile: Dockerfile
    container_name: movie_postgres_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: deeplearning
      POSTGRES_PASSWORD: deeplearning_secret
      POSTGRES_DB: movierec_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deeplearning -d movierec_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - app_network

volumes:
  pgdata:
    driver: local

networks:
  app_network:
    driver: bridge
