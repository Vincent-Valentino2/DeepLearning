name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ==========================================
  # CONTINUOUS INTEGRATION (CI)
  # ==========================================
  frontend-ci:
    name: Frontend Lint & Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and Build Frontend
        run: pnpm run build

  backend-ci:
    name: Backend Syntax & Health Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Verify Backend Modules and Model Integrity
        run: |
          python -c "import backend.main; print('FastAPI and MLP Model loaded successfully!')"

  docker-build-ci:
    name: Docker Multi-Container Build Verification
    runs-on: ubuntu-latest
    needs: [frontend-ci, backend-ci]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.backend
          push: false
          tags: movie-backend:latest

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.frontend
          push: false
          tags: movie-frontend:latest

  # ==========================================
  # CONTINUOUS DEPLOYMENT (CD)
  # ==========================================
  continuous-deployment:
    name: Automated Deployment Stage
    needs: [docker-build-ci]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deployment Notification & Verification
        run: |
          echo "=========================================="
          echo "CI checks passed! Proceeding to CD release."
          echo "Commit: ${{ github.sha }}"
          echo "Target Environment: Staging / Production Containers"
          echo "Services: Frontend (Nginx), Backend (FastAPI), Database (Postgres)"
          echo "=========================================="
          echo "Containers ready for automated rollout."
