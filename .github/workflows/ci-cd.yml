name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

env:
  # Release metadata baked into both images and shown in the UI footer.
  GIT_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  RELEASE_ENV: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'production' || 'preview' }}

jobs:
  # ==========================================
  # CONTINUOUS INTEGRATION (CI)
  # ==========================================
  frontend-ci:
    name: Frontend Lint & Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          package_json_file: frontend/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Typecheck and Build Frontend
        working-directory: frontend
        run: pnpm run build

  backend-ci:
    name: Backend Syntax & Health Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Verify Backend Modules and Model Integrity
        run: |
          python -c "import backend.main; print('FastAPI and MLP Model loaded successfully!')"

      - name: Run Backend Unit Tests
        run: python -m unittest backend.tests.test_prediction_store backend.tests.test_health backend.tests.test_requirements backend.tests.test_catalog -v

  docker-build-ci:
    name: Docker Multi-Container Build Verification
    runs-on: ubuntu-latest
    needs: [frontend-ci, backend-ci]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: false
          tags: movie-backend:latest
          build-args: |
            GIT_COMMIT_SHA=${{ env.GIT_COMMIT_SHA }}
            RELEASE_ENV=${{ env.RELEASE_ENV }}

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: movie-frontend:latest
          build-args: |
            GIT_COMMIT_SHA=${{ env.GIT_COMMIT_SHA }}
            RELEASE_ENV=${{ env.RELEASE_ENV }}

      - name: Start All Containers (Frontend, Backend, Database)
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: Verify Live Environment Health
        run: |
          set -euo pipefail
          echo "Frontend (Nginx :3000):"
          curl -fsS -o /dev/null -w "  HTTP %{http_code} in %{time_total}s\n" http://localhost:3000/
          echo "Backend via Nginx proxy (/api/health):"
          health=$(curl -fsS http://localhost:3000/api/health)
          echo "$health" | python3 -m json.tool
          echo "$health" | python3 -c "import json,sys; d=json.load(sys.stdin)['database']; assert d['engine']=='postgresql' and d['connected'], d; print('  PostgreSQL connected in', d['latency_ms'], 'ms')"
          echo "$health" | python3 -c "import json,sys,os; r=json.load(sys.stdin)['release']; assert r['commit_sha']==os.environ['GIT_COMMIT_SHA'], r; print('  Release', r['environment'], r['commit_sha'][:7])"

      - name: Dump Container Logs on Failure
        if: failure()
        run: docker compose ps && docker compose logs --no-color --tail 200

      - name: Stop Containers
        if: always()
        run: docker compose down -v

  # ==========================================
  # CONTINUOUS DEPLOYMENT (CD)
  # Runs only for pushes to main, after every CI job above has passed.
  #   1. publish-images : build the FE, BE and DB images once and push them to GHCR
  #                       (ghcr.io/<owner>/deeplearning-{frontend,backend,database}).
  #                       Each image gets an immutable <sha> tag; once all three are pushed,
  #                       "latest" is moved to them together, which is what Watchtower follows.
  #   2. deploy-server  : (optional) on the production server's self-hosted runner, pull exactly
  #                       those images (tag = commit SHA), restart the stack, and smoke-test it.
  #                       Servers running Watchtower need no runner: they pick up "latest" themselves.
  # ==========================================
  publish-images:
    name: Publish Container Images (GHCR)
    needs: [docker-build-ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compute image names (registry paths must be lowercase)
        id: names
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          for svc in backend frontend database; do
            echo "${svc}=${repo}-${svc}" >> "$GITHUB_OUTPUT"
          done

      # arm64 images run on ARM servers (e.g. Oracle Cloud Ampere) and Apple Silicon
      - name: Set up QEMU (multi-architecture builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.names.outputs.backend }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            GIT_COMMIT_SHA=${{ env.GIT_COMMIT_SHA }}
            RELEASE_ENV=${{ env.RELEASE_ENV }}

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.names.outputs.frontend }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            GIT_COMMIT_SHA=${{ env.GIT_COMMIT_SHA }}
            RELEASE_ENV=${{ env.RELEASE_ENV }}

      - name: Build & Push Database Image
        uses: docker/build-push-action@v5
        with:
          context: ./database
          file: ./database/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.names.outputs.database }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

      # Only now, with all three images pushed, move "latest". Watchtower therefore never sees
      # a new frontend paired with an old backend halfway through a publish.
      - name: Promote this release to latest
        env:
          REPO: ${{ steps.names.outputs.repo }}
        run: |
          set -euo pipefail
          for svc in backend frontend database; do
            docker buildx imagetools create -t "${REPO}-${svc}:latest" "${REPO}-${svc}:${GITHUB_SHA}"
          done
          {
            echo "### Published ${GITHUB_SHA::7} to GHCR as latest"
            for svc in frontend backend database; do echo "- \`${REPO}-${svc}:latest\`"; done
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-server:
    name: Deploy to Production Server (Docker)
    needs: [publish-images]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEPLOY_SERVER_ENABLED == 'true'
    # A GitHub Actions runner installed on the production server (VPS or laptop with Docker),
    # registered with the label "production". See docs/DEPLOYMENT.md.
    runs-on: [self-hosted, production]
    # Serialize production deploys; a newer push waits for the running one instead of racing it.
    concurrency:
      group: production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    env:
      TAG: ${{ github.sha }}
      COMPOSE_FILE: docker-compose.prod.yml
      FRONTEND_PORT: ${{ vars.FRONTEND_PORT || '3000' }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'deeplearning_secret' }}
    steps:
      # Only the compose file is fetched; the application itself arrives as images.
      - name: Fetch docker-compose.prod.yml
        uses: actions/checkout@v4
        with:
          sparse-checkout: docker-compose.prod.yml
          sparse-checkout-cone-mode: false

      - name: Pull the images built from this commit
        run: docker compose pull

      - name: Start the new release
        run: docker compose up -d --wait --wait-timeout 180 --remove-orphans

      - name: Smoke test
        run: |
          set -euo pipefail
          url="http://localhost:${FRONTEND_PORT}"
          curl -fsS -o /dev/null -w "Frontend HTTP %{http_code}\n" "$url/"
          curl -fsS "$url/api/health" | python3 -c "import json,os,sys; d=json.load(sys.stdin); r=d['release']; assert r['commit_sha']==os.environ['TAG'], r; assert d['model_loaded']; assert d['database']['connected'], d['database']; print('Release', r['commit_sha'][:7], '| status', d['status'], '| database', d['database']['engine'])"
          docker compose ps --format 'table {{.Service}}\t{{.Image}}\t{{.Status}}'

      - name: Release summary
        run: |
          {
            echo "### Deployed ${TAG::7} to the production server"
            echo '```'
            docker compose ps --format 'table {{.Service}}\t{{.Image}}\t{{.Status}}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove unused old images
        if: always()
        run: docker image prune -f --filter "until=168h" > /dev/null

      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 100
