# Production stack: runs the three images CI/CD published to GHCR. Nothing is built on
# the server and no source code is needed there; this file is the only thing it uses.
#
# Auto-update with Watchtower (default): start the stack once with TAG unset (= latest):
#
#   docker compose -f docker-compose.prod.yml up -d
#
# Every push to main that passes CI moves the "latest" tag; the watchtower service below
# polls the registry, pulls the new images and recreates the app containers on its own.
#
# Pinned release (self-hosted runner deploy or rollback): TAG=<commit sha> pins all three
# images to that commit, so Watchtower leaves them alone.
#
# Optional settings (environment or a .env file next to this file):
#   TAG                image tag (default latest)
#   FRONTEND_PORT      host port of the app (default 3000)
#   POSTGRES_PASSWORD  database password (default deeplearning_secret; change it on real servers)
#   WATCHTOWER_POLL_INTERVAL  seconds between registry checks (default 60)

name: tmdb-prod

services:
  # Container 1: Frontend (React build served by Nginx; proxies /api to the backend)
  frontend:
    image: ghcr.io/vincent-valentino2/deeplearning-frontend:${TAG:-latest}
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app_network

  # Container 2: Backend (FastAPI + MLP model + compact movie catalog, all inside the image)
  backend:
    image: ghcr.io/vincent-valentino2/deeplearning-backend:${TAG:-latest}
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true
    environment:
      - DATABASE_URL=postgresql://deeplearning:${POSTGRES_PASSWORD:-deeplearning_secret}@database:5432/movierec_db
      - PORT=8001
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - app_network

  # Container 3: Database (PostgreSQL 16 with the schema baked into the image)
  database:
    image: ghcr.io/vincent-valentino2/deeplearning-database:${TAG:-latest}
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deeplearning_secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deeplearning -d movierec_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - app_network

  # Container 4: Watchtower (auto-update). Polls the registry for the images above and,
  # when "latest" points to a new release, pulls it and recreates the container with the
  # same settings. Only containers labelled watchtower.enable=true are touched.
  # nickfedor/watchtower is the maintained fork; the original containrrr/watchtower is
  # archived and cannot talk to Docker Engine 29+.
  watchtower:
    image: nickfedor/watchtower:1.23.2
    restart: unless-stopped
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_POLL_INTERVAL: ${WATCHTOWER_POLL_INTERVAL:-60}
      WATCHTOWER_CLEANUP: "true"           # remove the replaced images
      WATCHTOWER_INCLUDE_RESTARTING: "true"
      WATCHTOWER_ROLLING_RESTART: "true"   # one container at a time
      TZ: ${TZ:-UTC}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

# Only the frontend publishes a port; the backend and database are reachable only on
# the private network, the same way Nginx reaches the backend in development.
volumes:
  pgdata:

networks:
  app_network:
    driver: bridge
